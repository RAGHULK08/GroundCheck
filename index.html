    <script>
      // Ignore Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || (e.reason.message && String(e.reason.message).includes('WebSocket')))) {
          e.preventDefault();
        }
      });
    </script>
